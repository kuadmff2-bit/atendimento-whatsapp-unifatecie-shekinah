name: Integrar IA ao bot

on:
  push:
    paths:
      - "scripts/integrar-ia.py"

permissions:
  contents: write

jobs:
  integrar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Aplicar integração
        run: python3 scripts/integrar-ia.py

      - name: Validar JavaScript
        run: |
          node --check index.js
          node --check ia-groq.js

      - name: Publicar integração
        run: |
          if git diff --quiet; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.js
          git commit -m "Integrar IA gratuita ao atendimento"
          git push
